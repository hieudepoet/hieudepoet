name: Update README assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *" # 00:00 Vietnam time
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-readme-assets.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  update-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PROFILE_TOKEN (optional) = read-only PAT, lets stats include private repos.
      - name: Generate stat cards
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hieudepoet
        run: python3 scripts/generate_assets.py

      - name: Generate 3D contribution calendar
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: hieudepoet

      - name: Generate snake animation
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hieudepoet
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update generated README assets"
          file_pattern: "assets/*.svg output/*.svg profile-3d-contrib/*.svg"
